# Self-hosted Linux runners for the CI and Installers workflows.
# Settings come from .env next to this file (copy .env.example); see ../README.md.
name: budget-runners

services:
  runner:
    image: myoung34/github-runner:${RUNNER_IMAGE_TAG:-2.338.0-ubuntu-jammy}
    # amd64 to match GitHub's ubuntu runners and the x86_64 Linux installer;
    # on Apple Silicon this runs under Rosetta (Docker Desktop: Settings → General).
    platform: ${RUNNER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    # Time to deregister the runner from GitHub on `docker compose down`.
    stop_grace_period: 30s
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/${RUNNER_REPOSITORY:-sxpersxnic/budget}
      # Fine-grained PAT; the entrypoint swaps it for a short-lived registration token
      # on every start and hides it from job steps.
      ACCESS_TOKEN: ${RUNNER_ACCESS_TOKEN:?Set RUNNER_ACCESS_TOKEN in .env}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-budget}
      # Workflows pick these runners through the LINUX_RUNNER repository variable.
      LABELS: ${RUNNER_LABELS:-budget-linux}
      # One job per registration: the container exits after a job and restarts with a new one.
      EPHEMERAL: "true"
      # Fixed path, so actions/checkout cleans up the previous job instead of each job
      # leaving a new directory behind. `docker compose up --force-recreate` starts from scratch.
      RUNNER_WORKDIR: /_work/runner
      RUN_AS_ROOT: "false"
      UNSET_CONFIG_VARS: "true"
    deploy:
      replicas: ${RUNNER_REPLICAS:-2}
