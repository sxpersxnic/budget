# Build the installers for macOS, Windows and Linux.
#
# - Every push to main and every manual run: the installers are attached to the run as artifacts.
# - A version tag (v0.2.0) must match [project] version in pyproject.toml; the installers and
#   their SHA-256 checksums are then published as a GitHub release.
name: Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.name }}
    needs: checks
    # The *_RUNNER repository variables move a build to a self-hosted runner (see
    # infra/docker/github-action-runners); unset, it runs on GitHub's runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: ${{ vars.MACOS_RUNNER || 'macos-latest' }} # Apple Silicon (arm64)
            pattern: dist/Budget-*-macOS-*.dmg
          - name: Windows
            os: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
            pattern: dist/Budget-*-Windows-Setup.exe
          - name: Linux
            # oldest supported glibc for the Qt WebEngine wheels (2.34+); the self-hosted image is 22.04 too
            os: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
            pattern: dist/Budget-*-Linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      # Libraries Qt WebEngine links against. PyInstaller bundles the ones it finds here;
      # build.py fails if one is still missing.
      - name: Qt libraries for the build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxfixes3 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 liblcms2-2 libminizip1 libopus0 libsnappy1v5 libwebp7 libwebpdemux2 \
            libwebpmux3
      - name: Install
        run: uv sync --locked --group build
      - name: Build
        run: uv run --group build python packaging/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum Budget-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Budget ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
