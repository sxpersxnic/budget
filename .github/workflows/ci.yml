# Lint, types, tests and coverage on every push and pull request (`just ci` runs the same locally).
# Two jobs, so a failure in one can be re-run alone ("Re-run failed jobs"): the checks take seconds, the tests minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, formatting, types
    # LINUX_RUNNER (repository variable) moves the jobs to the self-hosted runners in
    # infra/docker/github-action-runners. Pull requests from forks stay on GitHub's runners.
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy --ignore-missing-imports src

  tests:
    name: Tests
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev
      # parallel, one worker per CPU as far as the memory allows (tests/conftest.py)
      - name: Tests and coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
