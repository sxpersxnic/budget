# Lint, types, tests and coverage on every push and pull request.
# Also called by installers.yml, so no installer is built from code that fails its checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy --ignore-missing-imports src
      - name: Tests and coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
