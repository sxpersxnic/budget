[project]
name = "budget-app"
version = "0.1.0"
description = "Local personal budgeting app (CSV storage, CHF base currency, ECB exchange rates)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nicegui>=3.13",
    "pandas>=2.2",
    "plotly>=5.24",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "httpx>=0.27",
    "pypdfium2>=5.14.0",
    "zxing-cpp>=3.1.1",
    "pillow>=10",
]

[project.optional-dependencies]
# Linux: pywebview's Qt backend comes as wheels (the GTK one needs system packages)
native = ["pywebview>=5.0", "pywebview[qt]>=5.3; sys_platform == 'linux'"]
# Receipt scanning (F04): RapidOCR with its bundled PP-OCR models, run by ONNX Runtime; wheels only, nothing is
# downloaded. ONNX Runtime has no macOS x86_64 wheel for Python 3.13 any more, so Intel Macs get the manual flow.
ocr = ["rapidocr>=3.10", "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine == 'arm64'"]

[project.scripts]
budget = "budget_app.main:run"

[dependency-groups]
dev = [
    "lefthook>=2.2.2",
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "qrbill>=1.2.0",
    "ruff>=0.17.1",
    "segno>=1.6.6",
]
# installer builds (see packaging/README.md); the OCR engine goes into the installers too
build = [
    "pyinstaller>=6.10",
    "pywebview>=5.3",
    "pywebview[qt]>=5.3; sys_platform == 'linux'",
    "pillow>=10",
    "rapidocr>=3.10",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = ""  # UI tests pass their own main file (tests/ui/ui_main.py)
timeout = 120  # a hanging test fails with a traceback instead of blocking the pre-push hook

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM", "S", "RUF", "C4", "PIE", "RET", "PTH", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity thresholds
    "C408",                                                            # dict(...) is idiomatic for plotly kwargs
    "RUF001", "RUF002", "RUF003",                                      # intentional unicode (–, …, ≈)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.coverage.run]
source = ["budget_app"]

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]
